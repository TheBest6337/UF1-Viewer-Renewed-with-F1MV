productName: "UF1-Viewer-Renewed"
appId: "com.thebest6337.uf1-renewed"
copyright: "Copyright © 2023 MRAJEKO, 2026 TheBest6337"

generateUpdatesFilesForAllChannels: false
asar: true

npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

directories:
    output: "out"

win:
    icon: "src/icons/windows/logo.png"
    target:
        - target: "nsis"
          arch:
              - x64
              - ia32

mac:
    category: "public.app-category.utilities"
    minimumSystemVersion: "11.0.0"
    icon: "src/icons/windows/logo.png"
    target:
        - target: "dmg"
          arch:
              - x64
              - arm64
    artifactName: "${productName}-${version}-mac-${arch}.${ext}"

linux:
    icon: "src/icons/windows/logo.png"
    target:
        - target: "AppImage"
          arch:
              - x64

nsis:
    oneClick: true
    perMachine: true
    deleteAppDataOnUninstall: true

appImage:
    category: "Utility"

publish:
    provider: "github"
