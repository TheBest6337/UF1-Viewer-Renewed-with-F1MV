name: Build/release

on:
    push:
        branches:
            - Working
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            max-parallel: 1
            matrix:
                os: [macos-14, ubuntu-latest, windows-latest]

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Build/release Electron app
              run: npx electron-builder ${{ matrix.os == 'macos-14' && '--mac' || matrix.os == 'ubuntu-latest' && '--linux' || '--win' }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
              env:
                GH_TOKEN: ${{ secrets.github_token }}

            - name: Upload a Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-${{ matrix.os }}
                  path: |
                      out/win-unpacked
                      out/linux-unpacked
                      out/*.dmg
                      out/*.AppImage
                      out/*.exe
